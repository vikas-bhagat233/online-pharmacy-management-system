<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
  </head>
  <body style="margin:0;padding:0;background:#0b1020;">
    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background:#0b1020;">
      <tr>
        <td align="center" style="padding:28px 14px;">
          <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="620" style="width:620px;max-width:100%;">
            <tr>
              <td style="background:linear-gradient(135deg,#6d5efc,#2dd4bf);border-radius:16px;padding:16px 18px;">
                <div style="font-family:Arial,Helvetica,sans-serif;color:#0b1020;font-size:12px;letter-spacing:0.5px;font-weight:700;">MEDICARE</div>
                <div style="font-family:Arial,Helvetica,sans-serif;color:#0b1020;font-size:20px;font-weight:900;line-height:1.2;margin-top:6px;">{{title}}</div>
              </td>
            </tr>
            <tr>
              <td style="height:12px;"></td>
            </tr>
            <tr>
              <td style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:18px;">
                <div style="font-family:Arial,Helvetica,sans-serif;color:#cbd5e1;font-size:12px;">Order ID</div>
                <div style="font-family:Arial,Helvetica,sans-serif;color:#ffffff;font-size:14px;font-weight:700;">{{orderId}}</div>

                <div style="height:12px;"></div>

                <div style="font-family:Arial,Helvetica,sans-serif;color:#e5e7eb;font-size:14px;line-height:1.7;">{{message}}</div>

                <div style="height:14px;"></div>

                <div style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:14px;padding:12px 14px;">
                  <div style="font-family:Arial,Helvetica,sans-serif;color:#9ca3af;font-size:12px;">Delivery Agent</div>
                  <div style="font-family:Arial,Helvetica,sans-serif;color:#ffffff;font-size:14px;font-weight:800;margin-top:4px;">{{deliveryAgentName}}</div>
                  <div style="height:8px;"></div>
                  <div style="font-family:Arial,Helvetica,sans-serif;color:#9ca3af;font-size:12px;">Phone</div>
                  <div style="font-family:Arial,Helvetica,sans-serif;color:#ffffff;font-size:14px;font-weight:700;margin-top:4px;">{{deliveryAgentPhone}}</div>
                </div>

                {{invoiceSection}}

                <div style="height:12px;"></div>

                <div style="font-family:Arial,Helvetica,sans-serif;color:#9ca3af;font-size:12px;line-height:1.5;">
                  If you have any questions, reply to this email.
                </div>
              </td>
            </tr>
            <tr>
              <td style="padding:12px 6px 0 6px;">
                <div style="font-family:Arial,Helvetica,sans-serif;color:#64748b;font-size:11px;line-height:1.5;text-align:center;">
                  © {{year}} MediCare • This is an automated message.
                </div>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
