<!DOCTYPE html>
<html>

<head>
    <title>Sign Up</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../public/css/theme.css">

<body class="">
    <div class="app">
        <div class="container auth-container">
            <div class="card">
                <div class="brand" style="margin-bottom: 20px; align-items: center;">
                    <span class="badge" style="font-size: 32px;">MediCare</span>
                </div>

                <h2>Create Account</h2>

                <label for="name">Your name</label>
                <input type="text" id="name" placeholder="First and last name">

                <label for="email">Email</label>
                <input type="email" id="email" placeholder="you@example.com">

                <label for="password">Password</label>
                <input type="password" id="password" placeholder="At least 6 characters">
                <div style="font-size:11px; margin-top:-14px; margin-bottom:14px;" class="muted">Passwords must be at
                    least 6 characters.</div>

                <div class="actions">
                    <button onclick="signup()">Create your MediCare account</button>
                </div>

                <div style="font-size: 13px; margin-top: 20px;" class="muted">
                    Already have an account? <a href="login.html">Sign in</a>
                </div>
            </div>
        </div>
    </div>
    <script src="../public/js/config.js"></script>
    <script src="../public/js/auth.js?v=20260201"></script>
</body>

</html>
