<!DOCTYPE html>
<html>

<head>
    <title>Forgot Password</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../public/css/theme.css">
</head>

<body>
    <div class="app">
        <div class="container" style="max-width:520px;">
            <div class="card pad">
                <div class="topbar" style="padding:0 0 12px;">
                    <div class="brand">
                        <div class="badge">MediCare</div>
                        <div class="kicker">Password recovery</div>
                    </div>
                    <a class="kicker" href="login.html">Back to login</a>
                </div>
                <h2>Forgot Password</h2>
                <label>Email</label>
                <input type="email" id="email" placeholder="you@example.com">
                <div class="actions">
                    <button type="button" onclick="resetPassword()">Send Reset Link</button>
                </div>
                <div class="muted">Note: backend reset endpoints may not be wired yet.</div>
            </div>
        </div>
    </div>
    <script src="../public/js/config.js"></script>
    <script src="../public/js/auth.js"></script>
</body>

</html>
