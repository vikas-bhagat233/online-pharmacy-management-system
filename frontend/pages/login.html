<!DOCTYPE html>
<html>

<head>
    <title>Login</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../public/css/theme.css">

<body class="">
    <div class="app">
        <div class="container auth-container">
            <div class="card">
                <div class="brand" style="margin-bottom: 20px; align-items: center;">
                    <span class="badge" style="font-size: 32px;">MediCare</span>
                </div>

                <h2>Sign-In</h2>
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="you@example.com">

                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••">

                <div class="actions" style="display: flex; flex-direction: column; gap: 15px;">
                    <button onclick="login()">Sign-In</button>
                </div>

                <div style="font-size: 13px; margin-bottom: 20px;" class="muted">
                    By continuing, you agree to MediCare's Conditions of Use and Privacy Notice.
                </div>

                <div class="footer-links" style="display: flex; justify-content: space-between; align-items: center;">
                    <a href="forgot-password.html" class="muted">Forgot Password?</a>
                </div>
            </div>

            <div style="text-align: center; margin-top: 20px;">
                <p style="font-size: 13px; margin-bottom: 10px;" class="muted">New to MediCare?</p>
                <a href="signup.html">
                    <button class="secondary" style="width: 100%;">Create your MediCare account</button>
                </a>
            </div>
        </div>
    </div>
    <script src="../public/js/config.js"></script>
    <script src="../public/js/auth.js?v=20260201"></script>
</body>

</html>
