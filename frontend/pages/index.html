<!DOCTYPE html>
<html>

<head>
    <title>MediCare - Home</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../public/css/theme.css">

</head>

<body class="">
    <div class="app">
        <header class="topbar">
            <div class="brand">
                <div class="badge">MediCare</div>
                <div class="kicker">Online Pharmacy</div>
            </div>
            <div class="actions">
                <a href="login.html">Login</a>
                <a href="signup.html">Sign Up</a>
            </div>
        </header>

        <div class="container">
            <div class="hero-section" style="text-align: center; padding: 60px 20px;">
                <h1>Welcome to MediCare Pharmacy</h1>
                <p>
                    Order medicines, track delivery, and manage prescriptions — with a modern, secure experience.
                </p>

                <div style="display: flex; gap: 20px; justify-content: center; margin-top: 30px;">
                    <a href="medicines.html">
                        <button type="button">Browse Medicines</button>
                    </a>
                    <a href="login.html">
                        <button class="secondary" type="button">Login</button>
                    </a>
                </div>
            </div>

            <!-- Featured Categories -->
            <div class="product-grid" style="margin-top: 40px;">
                <div class="card" style="text-align: center;">
                    <h3>Prescriptions</h3>
                    <p class="muted">Upload and order</p>
                </div>
                <div class="card" style="text-align: center;">
                    <h3>General Health</h3>
                    <p class="muted">Supplements & Vitamins</p>
                </div>
                <div class="card" style="text-align: center;">
                    <h3>Personal Care</h3>
                    <p class="muted">Skin & Body</p>
                </div>
                <div class="card" style="text-align: center;">
                    <h3>Devices</h3>
                    <p class="muted">Thermometers & More</p>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
